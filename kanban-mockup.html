<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>需求看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;

    /* 中性阶：页面最深，浮层最浅，四级足够表达层次 */
    --bg:        #08090a;
    --surface:   #0f1011;
    --panel:     #16181a;
    --panel-2:   #131517;
    --raise:     #1c1f22;

    --line:      #1f2226;
    --line-2:    #2a2e33;

    --text:      #e9ebed;
    --text-2:    #8a9098;
    --text-3:    #5c6167;

    --accent:    #5e6ad2;
    --accent-2:  #8b93e0;
    --accent-bg: rgba(94, 106, 210, .13);

    --ok:        #4cb782;
    --amber:     #f2994a;
    --err:       #eb5757;

    --overlay: 0 0 0 1px rgba(255, 255, 255, .04),
               0 8px 16px -4px rgba(0, 0, 0, .5),
               0 24px 48px -12px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, "SF Pro Text", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    line-height: 1.5;
    /* 负字距对 Latin 有益，对中文几乎无感；数字一律等宽对齐 */
    letter-spacing: -.006em;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--line-2);
    border-radius: 6px;
    border: 3px solid transparent;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: #3a3f46; background-clip: content-box; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }

  /* ---------- 顶栏 ---------- */

  .bar { flex: none; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 30; }

  .bar-row { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 45px; }
  .bar-row + .bar-row { border-top: 1px solid var(--line); height: 41px; }
  .bar-spacer { flex: 1 1 auto; }

  .brand { display: flex; align-items: center; gap: 2px; margin: 0; font-size: 13px; font-weight: 400; }
  .brand .org { color: var(--text-2); }
  .brand .slash { color: var(--text-3); padding: 0 2px; }

  .repo-wrap { position: relative; display: inline-flex; align-items: center; }

  .repo {
    font: inherit;
    font-weight: 500;
    color: var(--text);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 3px 20px 3px 6px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
  }

  .repo:hover { background: var(--raise); }
  .repo option { background: var(--panel); color: var(--text); }

  .repo-wrap .caret {
    position: absolute; right: 6px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-3);
    pointer-events: none;
    display: flex;
  }

  .count { color: var(--text-3); white-space: nowrap; }
  .count b { color: var(--text-2); font-weight: 500; }

  /* ---------- 密度切换 ---------- */

  .seg { display: inline-flex; gap: 2px; background: var(--surface); border-radius: 6px; padding: 2px; }

  .seg button {
    font: inherit;
    font-size: 12px;
    padding: 3px 10px;
    background: transparent;
    color: var(--text-2);
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }

  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--raise); color: var(--text); }

  /* ---------- 筛选器 ---------- */

  .ctrl { position: relative; display: inline-flex; }

  .fbtn {
    font: inherit;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 210px;
    color: var(--text-2);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
  }

  .fbtn:hover { background: var(--surface); border-color: var(--line-2); color: var(--text); }

  /* 有筛选时才提亮；全选是静默态，不该抢注意力 */
  .fbtn.on {
    background: var(--accent-bg);
    border-color: rgba(94, 106, 210, .38);
    color: var(--accent-2);
  }
  .fbtn.on .fv { color: var(--text); }
  .fbtn.on:hover { background: rgba(94, 106, 210, .2); }

  .fbtn .fv {
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .fbtn .fn { color: var(--text-3); flex: none; }
  .fbtn.on .fn { color: var(--accent-2); }
  .fbtn .chev { flex: none; display: flex; opacity: .55; }
  .fbtn[aria-expanded="true"] { background: var(--surface); border-color: var(--line-2); }

  .fmenu {
    position: absolute;
    top: calc(100% + 5px);
    left: 0;
    min-width: 238px;
    max-height: 342px;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 9px;
    box-shadow: var(--overlay);
    z-index: 100;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }

  .fmenu.open { display: flex; }

  .fsearch { flex: none; padding: 7px 8px; border-bottom: 1px solid var(--line); }

  .fsearch input {
    width: 100%;
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line-2);
    border-radius: 5px;
    padding: 5px 8px;
  }

  .fsearch input::placeholder { color: var(--text-3); }
  .fsearch input:focus { outline: none; border-color: var(--accent); }

  .fopts { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 5px; }

  .opt {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 7px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text);
  }

  .opt:hover { background: var(--raise); }
  .opt input { position: absolute; opacity: 0; width: 0; height: 0; }

  .box {
    flex: none;
    width: 14px; height: 14px;
    border: 1px solid var(--line-2);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel-2);
  }

  .box svg { opacity: 0; color: #fff; }
  .opt:hover .box { border-color: #40454c; }
  .opt input:checked ~ .box { background: var(--accent); border-color: var(--accent); }
  .opt input:checked ~ .box svg { opacity: 1; }
  .opt input:focus-visible ~ .box { outline: 2px solid var(--accent); outline-offset: 1px; }

  .opt-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt-t .sub { color: var(--text-3); }

  /* 「全部」固定在底部，不随选项列表滚动 */
  .fall {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-top: 1px solid var(--line);
    background: var(--panel-2);
    font-size: 12px;
    color: var(--text-2);
    cursor: pointer;
  }

  .fall:hover { color: var(--text); }

  .clear {
    font: inherit;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--text-2);
    background: transparent;
    border: 0;
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
  }

  .clear:hover { background: var(--surface); color: var(--text); }
  .clear[hidden] { display: none; }

  /* ---------- 看板 ---------- */
  /* 每列独立纵向滚动，看板只负责横向 —— 列头无需 sticky */

  .board {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(236px, 1fr);
    gap: 8px;
    padding: 8px;
    overflow-x: auto;
    overflow-y: hidden;
  }

  .col {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  .col-head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 11px 12px 9px;
  }

  .col-head .ico { flex: none; display: flex; }
  .col-head h2 { margin: 0; font-size: 12px; font-weight: 500; color: var(--text); }
  .col-head .n { font-size: 12px; color: var(--text-3); }

  .col-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 8px 8px; }

  /* ---------- 卡片 ---------- */
  /* article 而非 button：编号与 PR 都要能单独点，整卡可点由标题的 ::after 铺满实现 */

  .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 7px;
    margin-bottom: 6px;
    overflow: hidden;
  }

  .card:hover { background: var(--raise); border-color: var(--line-2); }
  .card:focus-within { border-color: var(--accent); }

  .card-body { padding: 9px 10px 8px; }

  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }

  .id {
    font-size: 11px;
    color: var(--text-3);
    flex: none;
    text-decoration: none;
    position: relative;
    z-index: 2;
  }

  .id:hover { color: var(--accent-2); }

  .ver { margin-left: auto; font-size: 11px; color: var(--text-3); flex: none; }

  .title { margin: 0 0 9px; font-size: 13px; font-weight: 450; line-height: 1.45; }

  .title a {
    color: var(--text);
    text-decoration: none;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .title a::after { content: ""; position: absolute; inset: 0; z-index: 1; }

  /* ---------- 人：创建人 → 处理人 ---------- */
  /* 头像配色只做身份识别，不承载状态 */

  .meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-2); min-width: 0; }
  .ppl { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .ppl .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta .to { color: var(--text-3); flex: none; display: flex; }

  .faces { display: inline-flex; flex: none; }
  .faces .who + .who { margin-left: -4px; }

  .who {
    width: 17px; height: 17px;
    border-radius: 50%;
    color: #fff;
    font-size: 10px;
    font-weight: 500;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    box-shadow: 0 0 0 1.5px var(--panel);
    letter-spacing: 0;
  }

  .card:hover .who { box-shadow: 0 0 0 1.5px var(--raise); }

  .who[data-c="1"] { background: #4c6ef5; }
  .who[data-c="2"] { background: #2f9e74; }
  .who[data-c="3"] { background: #8a63d2; }
  .who[data-c="4"] { background: #c2703e; }
  .who[data-c="5"] { background: #5a6570; }
  .who[data-c="6"] { background: #bf4b7d; }

  .who.na {
    background: transparent;
    border: 1px dashed var(--line-2);
    color: var(--text-3);
    box-shadow: none;
  }

  .ppl.na .nm { color: var(--text-3); }

  /* ---------- 状态区 ---------- */
  /* PR 与流水线各占一行，互不混用；颜色只落在流水线圆点上 */

  .state { border-top: 1px solid var(--line); background: var(--panel-2); }
  .card:hover .state { background: rgba(0, 0, 0, .18); }

  .row { padding: 5px 10px; display: flex; align-items: center; gap: 7px; min-width: 0; }
  .row + .row { padding-top: 0; }

  .row .kw { font-size: 11px; flex: none; color: var(--text-2); }
  .row[data-pr="none"] .kw { color: var(--text-3); }
  .row[data-pr="merged"] .kw { color: var(--accent-2); }

  .row .ref {
    font-size: 11px;
    color: var(--text-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-decoration: none;
    position: relative;
    z-index: 2;
  }

  .row a.ref:hover { color: var(--accent-2); }
  .row .more { margin-left: auto; flex: none; font-size: 11px; color: var(--text-3); }

  /* 流水线状态：实心点=终态，环形=进行中，空心=未触发 */
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; position: relative; }
  .dot.pass { background: var(--ok); }
  .dot.fail { background: var(--err); }
  .dot.na   { border: 1px solid var(--line-2); }

  .dot.running {
    background: conic-gradient(var(--amber) 0 72%, transparent 72%);
    animation: spin 1.3s linear infinite;
  }

  .dot.running::after {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: 50%;
    background: var(--panel-2);
  }

  .card:hover .dot.running::after { background: #12151a; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .row[data-ci="fail"] .kw { color: var(--err); }

  /* ---------- 紧凑模式 ---------- */
  /* 保留头像（站会要知道谁在做），隐去名字与引用 */

  body[data-density="compact"] .meta .nm { display: none; }
  body[data-density="compact"] .row .ref { display: none; }
  body[data-density="compact"] .title a { -webkit-line-clamp: 1; }
  body[data-density="compact"] .title { margin-bottom: 7px; }
  body[data-density="compact"] .card-body { padding: 8px 10px 7px; }

  .empty { padding: 10px 2px; font-size: 12px; color: var(--text-3); }

  @media (max-width: 900px) {
    /* 窄屏纵向排列，交回页面滚动 */
    body { height: auto; display: block; }
    .bar { position: sticky; top: 0; }
    .bar-row { flex-wrap: wrap; height: auto; padding: 8px 12px; }
    .bar-row + .bar-row { height: auto; }
    .board {
      grid-auto-flow: row;
      grid-auto-columns: auto;
      overflow: visible;
      min-height: 0;
    }
    .col { overflow: visible; }
    .col-body { overflow: visible; max-height: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .dot.running { background: var(--amber); }
    .dot.running::after { display: none; }
  }
</style>
</head>
<body data-density="full">

<div class="bar">
  <div class="bar-row">
    <h1 class="brand">
      <span class="org">workbuddy</span><span class="slash">/</span>
      <span class="repo-wrap">
        <select id="f-repo" class="repo" aria-label="仓库"></select>
        <span class="caret">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4 5 6.5 7.5 4"/></svg>
        </span>
      </span>
    </h1>

    <span class="count" id="count"></span>

    <span class="bar-spacer"></span>

    <div class="seg" role="group" aria-label="卡片密度">
      <button type="button" data-d="full" aria-pressed="true">完整</button>
      <button type="button" data-d="compact" aria-pressed="false">紧凑</button>
    </div>
  </div>

  <div class="bar-row" id="filters"></div>
</div>

<div class="board" id="board"></div>

<script>
const COLS = [
  { key: "to-review",  name: "待评审" },
  { key: "reviewed",   name: "已评审" },
  { key: "trial",      name: "产品体验中" },
  { key: "to-accept",  name: "待验收" },
  { key: "accepted",   name: "验收通过" },
  { key: "done",       name: "已完成" }
];

// 仓库名来自数据，不写死在标题里
const REPOS = [
  { key: "api",   name: "workbuddy-api" },
  { key: "web",   name: "workbuddy-web" },
  { key: "agent", name: "workbuddy-agent" }
];

// 链接地址集中在这里，换代码托管平台只改这两个函数
const HOST = "https://git.workbuddy.internal/workbuddy";
function issueURL(repo, id) { return HOST + "/" + repo + "/issues/" + id; }
function prURL(repo, num)   { return HOST + "/" + repo + "/pulls/" + num; }

// c 是头像配色编号。颜色只用于身份识别，不承载状态含义。
const PEOPLE = {
  alice:  { nick: "林安", c: 1 },
  bob:    { nick: "陈博", c: 2 },
  chen:   { nick: "程晨", c: 3 },
  priya:  { nick: "普里", c: 4 },
  dmitri: { nick: "周德", c: 5 },
  fang:   { nick: "方琳", c: 6 }
};

// who = 创建人（单人）；as = 处理人数组，空数组表示未分配
// PR 三态：pr 为 null 表示未关联；merged 决定「已合并」或「开启中」
// ci 独立于 PR 状态：'pass' | 'running' | 'fail' | null(未触发)
const ISSUES = [
  { id: 421, repo: "api", col: "to-review", ver: "5.8.0", who: "alice", as: [],
    title: "部署接口补充结构化日志", pr: null },
  { id: 433, repo: "api", col: "to-review", ver: "5.7.3", who: "dmitri", as: [],
    title: "迁移脚本 0041 删除了错误的索引", pr: null },

  { id: 447, repo: "api", col: "reviewed", ver: "5.9.0", who: "priya", as: ["chen", "dmitri"],
    title: "并行矩阵任务把执行机池耗尽", pr: null },
  { id: 489, repo: "api", col: "reviewed", ver: "5.9.0", who: "dmitri", as: [],
    title: "拆分单体配置加载器", pr: null },

  { id: 456, repo: "api", col: "trial", ver: "5.8.0", who: "alice", as: ["alice"],
    title: "大报文场景下 Webhook 投递超时",
    pr: { num: 812, author: "林安", merged: false, ci: "fail" } },
  { id: 478, repo: "api", col: "trial", ver: "5.9.0", who: "bob", as: ["bob"],
    title: "缓存预热阻塞就绪探针",
    pr: { num: 818, author: "陈博", merged: false, ci: "pass" } },
  { id: 481, repo: "api", col: "trial", ver: "5.8.0", who: "priya", as: ["priya", "alice", "chen"],
    title: "服务账号写入时审计日志缺少操作人",
    pr: { num: 820, author: "普里", merged: false, ci: "running" } },
  { id: 493, repo: "api", col: "trial", ver: "5.9.0", who: "chen", as: ["chen"],
    title: "灰度开关支持按租户维度下发",
    pr: { num: 833, author: "程晨", merged: false, ci: "pass" } },

  { id: 502, repo: "api", col: "to-accept", ver: "5.9.0", who: "bob", as: ["chen"],
    title: "需求与 PR 的关联改为事件驱动",
    pr: { num: 821, author: "陈博", merged: false, ci: "pass" } },
  { id: 510, repo: "api", col: "to-accept", ver: "5.8.0", who: "alice", as: ["chen", "bob"],
    title: "补充发版切分检查清单",
    pr: { num: 826, author: "程晨", merged: false, ci: null, extra: 1 } },

  { id: 515, repo: "api", col: "accepted", ver: "5.9.0", who: "chen", as: ["chen"],
    title: "灰度失败后出现重试风暴",
    pr: { num: 829, author: "程晨", merged: false, ci: "fail" } },
  { id: 520, repo: "api", col: "accepted", ver: "5.8.0", who: "bob", as: ["bob"],
    title: "导出任务超时后不释放连接",
    pr: { num: 835, author: "陈博", merged: true, into: "release/5.9.0", ci: "pass" } },

  { id: 388, repo: "api", col: "done", ver: "5.7.3", who: "chen", as: ["chen"],
    title: "看板列顺序按用户维度持久化",
    pr: { num: 794, author: "程晨", merged: true, into: "release/5.7.3", ci: "pass" } },
  { id: 402, repo: "api", col: "done", ver: "5.7.3", who: "priya", as: ["priya", "dmitri"],
    title: "版本筛选未排除已归档版本",
    pr: { num: 801, author: "普里", merged: true, into: "release/5.7.3", ci: "pass", extra: 2 } },

  { id: 610, repo: "web", col: "to-review", ver: "5.9.0", who: "fang", as: [],
    title: "看板横向滚动时列头不吸顶", pr: null },
  { id: 618, repo: "web", col: "reviewed", ver: "5.8.0", who: "alice", as: ["fang"],
    title: "需求详情抽屉支持键盘关闭", pr: null },
  { id: 624, repo: "web", col: "trial", ver: "5.9.0", who: "fang", as: ["fang", "alice"],
    title: "卡片密度切换后滚动位置丢失",
    pr: { num: 901, author: "方琳", merged: false, ci: "running" } },
  { id: 631, repo: "web", col: "to-accept", ver: "5.8.0", who: "bob", as: ["fang"],
    title: "筛选条件写入地址栏以便分享",
    pr: { num: 907, author: "方琳", merged: false, ci: "pass" } },
  { id: 640, repo: "web", col: "done", ver: "5.8.0", who: "fang", as: ["fang"],
    title: "版本下拉按语义化版本排序",
    pr: { num: 912, author: "方琳", merged: true, into: "release/5.8.0", ci: "pass" } },

  { id: 705, repo: "agent", col: "reviewed", ver: "5.9.0", who: "dmitri", as: ["dmitri"],
    title: "执行机离线后任务不重新排队", pr: null },
  { id: 719, repo: "agent", col: "trial", ver: "5.9.0", who: "chen", as: ["priya", "dmitri"],
    title: "日志上传限流导致尾部日志丢失",
    pr: { num: 958, author: "普里", merged: false, ci: "fail" } },
  { id: 712, repo: "agent", col: "accepted", ver: "5.8.0", who: "priya", as: ["dmitri"],
    title: "凭据轮换期间执行机掉线",
    pr: { num: 950, author: "周德", merged: true, into: "release/5.8.0", ci: "pass" } }
];

// PR 三态判定：无 PR / 开启中 / 已合并。刻意不读取 ci 字段。
function prOf(pr) {
  if (!pr) return { key: "none", kw: "未关联 PR", ref: "", more: "" };
  if (pr.merged) return {
    key: "merged", kw: "已合并",
    ref: "#" + pr.num + " → " + (pr.into || "未知分支"),
    more: pr.extra ? "另 " + pr.extra + " 个" : ""
  };
  return {
    key: "open", kw: "开启中",
    ref: "#" + pr.num + " " + pr.author,
    more: pr.extra ? "另 " + pr.extra + " 个" : ""
  };
}

// 流水线状态判定：与 PR 状态完全独立，互不覆盖
const CI_TEXT = { pass: "构建通过", running: "构建中", fail: "构建失败" };

function ciOf(pr) {
  if (!pr || !pr.ci) return { key: "na", kw: "未触发构建", show: !!pr };
  return { key: pr.ci, kw: CI_TEXT[pr.ci], show: true };
}

const board = document.getElementById("board");
const fRepo = document.getElementById("f-repo");
const countEl = document.getElementById("count");
const filtersEl = document.getElementById("filters");

// 顺序即渲染顺序；searchable 决定菜单是否带搜索框
const FILTERS = [
  { key: "ver", label: "版本",    searchable: true },
  { key: "who", label: "创建人",  searchable: true },
  { key: "as",  label: "处理人",  searchable: true },
  { key: "pr",  label: "PR",     searchable: false },
  { key: "ci",  label: "流水线",  searchable: false }
];

const NO_ASSIGNEE = "__none";
const MAX_FACES = 3;   // 超出只叠 3 个头像，余下以 +N 表示

const TICK = '<svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.6 5.2 3.9 7.4 8.4 2.4"/></svg>';
const CHEV = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4 5 6.5 7.5 4"/></svg>';

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}

// 列头图标把流程位置编码成环形填充量：虚线环 → 逐级填充 → 实心带勾
function colIcon(i, total) {
  const last = i === total - 1;
  const c = i === 0 ? "#5c6167" : last ? "#4cb782" : i === 1 ? "#8a9098" : "#5e6ad2";

  if (last) {
    return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none">' +
      '<circle cx="7" cy="7" r="6.25" fill="' + c + '"/>' +
      '<path d="M4.2 7.1 6.1 9 9.8 5.2" stroke="#08090a" stroke-width="1.5" ' +
        'stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  // 内圈用粗描边从圆心往外铺，dasharray 控制填充比例（r=2.75 周长≈17.28）
  const frac = [0, 0, .34, .62, .86][i] || 0;
  const inner = frac
    ? '<circle cx="7" cy="7" r="2.75" fill="none" stroke="' + c + '" stroke-width="5.5" ' +
      'stroke-dasharray="' + (17.28 * frac).toFixed(2) + ' 17.28" transform="rotate(-90 7 7)"/>'
    : '';

  return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none">' +
    '<circle cx="7" cy="7" r="5.6" stroke="' + c + '" stroke-width="1.4"' +
      (i === 0 ? ' stroke-dasharray="1.7 2.1"' : '') + '/>' +
    inner + '</svg>';
}

// 语义化版本按段比较：字典序会把 5.10.0 排到 5.9.0 前面
function cmpVer(a, b) {
  const x = a.split(".").map(Number), y = b.split(".").map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    const d = (y[i] || 0) - (x[i] || 0);   // 新版本在前
    if (d) return d;
  }
  return 0;
}

function byNick(a, b) {
  return PEOPLE[a].nick.localeCompare(PEOPLE[b].nick, "zh-CN");
}

function avatar(k) {
  const p = PEOPLE[k];
  return '<span class="who" data-c="' + p.c + '">' + esc(p.nick.slice(0, 1)) + '</span>';
}

REPOS.forEach(r => {
  fRepo.insertAdjacentHTML("beforeend", '<option value="' + r.key + '">' + esc(r.name) + '</option>');
});

// 筛选器结构由 FILTERS 生成，新增一个维度只需往数组里加一项
filtersEl.innerHTML = FILTERS.map(f =>
  '<div class="ctrl">' +
    '<button type="button" class="fbtn" data-filter="' + f.key + '" aria-expanded="false">' +
      '<span class="fn">' + esc(f.label) + '</span>' +
      '<span class="fv" id="f-' + f.key + '-val"></span>' +
      '<span class="chev">' + CHEV + '</span>' +
    '</button>' +
    '<div class="fmenu" id="f-' + f.key + '-menu">' +
      (f.searchable
        ? '<div class="fsearch"><input type="text" class="fsearch-input" placeholder="搜索' +
          esc(f.label) + '" aria-label="搜索' + esc(f.label) + '"></div>'
        : '') +
      '<div class="fopts" id="f-' + f.key + '-opts" data-filter="' + f.key + '"></div>' +
      '<label class="fall">' +
        '<input type="checkbox" class="fall-cb" data-filter="' + f.key + '" checked>' +
        '<span class="box">' + TICK + '</span><span>全部</span>' +
      '</label>' +
    '</div>' +
  '</div>'
).join("") +
  '<span class="bar-spacer"></span>' +
  '<button type="button" class="clear" id="clear" hidden>清空筛选</button>';

const clearBtn = document.getElementById("clear");

function optsEl(key) { return document.getElementById("f-" + key + "-opts"); }
function menuEl(key) { return document.getElementById("f-" + key + "-menu"); }
function btnEl(key)  { return document.querySelector('.fbtn[data-filter="' + key + '"]'); }

// 选项只列当前仓库里实际存在的值，避免选出必然为空的组合。
// 切仓库后沿用原选择；原值已不存在的部分自然落空，全新值默认选中。
function fillOptions(key, items) {
  const el = optsEl(key);
  const first = el.dataset.ready !== "1";
  const prev = first ? null : new Set(getSelected(key));
  const dropped = first ? null : new Set(
    Array.from(el.querySelectorAll("input"), i => i.value).filter(v => !prev.has(v))
  );

  el.innerHTML = items.map(([v, label, pre]) =>
    '<label class="opt">' +
      '<input type="checkbox" value="' + esc(v) + '" data-label="' + esc(label) + '"' +
        (dropped && dropped.has(v) ? '' : ' checked') + '>' +
      '<span class="box">' + TICK + '</span>' +
      (pre || '') +
      '<span class="opt-t">' + esc(label) + '</span>' +
    '</label>'
  ).join("");

  el.dataset.ready = "1";
  syncAll(key);
}

function getSelected(key) {
  return Array.from(optsEl(key).querySelectorAll("input:checked"), e => e.value);
}

// 按钮只展示首项 + 余量，避免选多了把顶栏撑开
function syncAll(key) {
  const all = Array.from(optsEl(key).querySelectorAll("input"));
  const on = all.filter(cb => cb.checked);
  const isAll = all.length > 0 && on.length === all.length;

  menuEl(key).querySelector(".fall-cb").checked = isAll;

  const valEl = document.getElementById("f-" + key + "-val");
  const btn = btnEl(key);

  if (isAll) {
    valEl.textContent = "";
    btn.classList.remove("on");
  } else if (!on.length) {
    valEl.textContent = "无";
    btn.classList.add("on");
  } else {
    valEl.textContent = on[0].dataset.label + (on.length > 1 ? "  +" + (on.length - 1) : "");
    btn.classList.add("on");
  }
}

function rebuildFilters() {
  const inRepo = ISSUES.filter(i => i.repo === fRepo.value);

  fillOptions("ver", [...new Set(inRepo.map(i => i.ver))].sort(cmpVer).map(v => [v, "v" + v]));
  fillOptions("who", [...new Set(inRepo.map(i => i.who))].sort(byNick)
    .map(k => [k, PEOPLE[k].nick, avatar(k)]));

  // 处理人可多人，所以按 flatMap 汇总
  const as = [...new Set(inRepo.flatMap(i => i.as))].sort(byNick)
    .map(k => [k, PEOPLE[k].nick, avatar(k)]);
  if (inRepo.some(i => i.as.length === 0)) as.push([NO_ASSIGNEE, "未分配"]);
  fillOptions("as", as);

  fillOptions("pr", [["none", "未关联 PR"], ["open", "开启中"], ["merged", "已合并"]]);
  fillOptions("ci", [["fail", "构建失败"], ["running", "构建中"],
                     ["pass", "构建通过"], ["na", "未触发构建"]]);
}

function repoName() {
  const r = REPOS.find(r => r.key === fRepo.value);
  return r ? r.name : "";
}

// 单人：头像 + 名字。多人：叠放头像 + 首位名字 + 「+N」
function peopleHTML(keys, role) {
  if (!keys.length) {
    return '<span class="ppl na" title="' + role + '：未分配">' +
             '<span class="who na">—</span><span class="nm">未分配</span></span>';
  }

  const all = keys.map(k => PEOPLE[k].nick).join("、");
  const faces = keys.slice(0, MAX_FACES).map(avatar).join("");
  const label = keys.length === 1
    ? esc(PEOPLE[keys[0]].nick)
    : esc(PEOPLE[keys[0]].nick) + " +" + (keys.length - 1);

  return '<span class="ppl" title="' + role + '：' + esc(all) + '">' +
           '<span class="faces">' + faces + '</span>' +
           '<span class="nm">' + label + '</span>' +
         '</span>';
}

const ARROW = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 5h7M6 2.5 8.5 5 6 7.5"/></svg>';

function cardHTML(it) {
  const p = prOf(it.pr);
  const c = ciOf(it.pr);

  // 无 PR 时没有可指向的地址，保持纯文本
  const refHTML = p.ref
    ? '<a class="ref" href="' + prURL(it.repo, it.pr.num) + '" target="_blank" rel="noopener">' +
        esc(p.ref) + '</a>'
    : '';

  const prRow = '<div class="row" data-pr="' + p.key + '">' +
      '<span class="kw">' + esc(p.kw) + '</span>' + refHTML +
      (p.more ? '<span class="more">' + esc(p.more) + '</span>' : '') +
    '</div>';

  const ciRow = c.show
    ? '<div class="row" data-ci="' + c.key + '">' +
        '<span class="dot ' + c.key + '"></span>' +
        '<span class="kw">' + esc(c.kw) + '</span>' +
      '</div>'
    : '';

  return '<article class="card">' +
    '<div class="card-body">' +
      '<div class="card-top">' +
        '<a class="id" href="' + issueURL(it.repo, it.id) + '" target="_blank" rel="noopener">#' +
          it.id + '</a>' +
        '<span class="ver">v' + esc(it.ver) + '</span>' +
      '</div>' +
      '<h3 class="title"><a href="' + issueURL(it.repo, it.id) + '" target="_blank" rel="noopener">' +
        esc(it.title) + '</a></h3>' +
      '<div class="meta">' +
        peopleHTML([it.who], "创建人") +
        '<span class="to">' + ARROW + '</span>' +
        peopleHTML(it.as, "处理人") +
      '</div>' +
    '</div>' +
    '<div class="state">' + prRow + ciRow + '</div>' +
  '</article>';
}

function render() {
  // 全选等同于不筛选：维度整体放行，不参与过滤
  const pick = key => {
    const all = optsEl(key).querySelectorAll("input").length;
    const on = getSelected(key);
    return on.length === all ? null : on;
  };

  const v = pick("ver"), w = pick("who"), a = pick("as"), p = pick("pr"), ci = pick("ci");
  const filtering = [v, w, a, p, ci].some(x => x !== null);

  const inRepo = ISSUES.filter(it => it.repo === fRepo.value);

  const shown = inRepo.filter(it =>
    (!v  || v.includes(it.ver)) &&
    (!w  || w.includes(it.who)) &&
    (!a  || (it.as.length ? it.as.some(x => a.includes(x)) : a.includes(NO_ASSIGNEE))) &&
    (!p  || p.includes(prOf(it.pr).key)) &&
    (!ci || ci.includes(ciOf(it.pr).key))
  );

  board.innerHTML = COLS.map((c, i) => {
    const items = shown.filter(x => x.col === c.key);

    return '<section class="col">' +
      '<div class="col-head">' +
        '<span class="ico">' + colIcon(i, COLS.length) + '</span>' +
        '<h2>' + c.name + '</h2>' +
        '<span class="n">' + items.length + '</span>' +
      '</div>' +
      '<div class="col-body">' +
        (items.length
          ? items.map(cardHTML).join("")
          : '<div class="empty">' + (filtering ? "没有匹配的需求" : "暂无需求") + '</div>') +
      '</div>' +
    '</section>';
  }).join("");

  countEl.innerHTML = filtering
    ? '<b>' + shown.length + '</b> / ' + inRepo.length + ' 条'
    : '<b>' + inRepo.length + '</b> 条';

  clearBtn.hidden = !filtering;
  document.title = repoName() + " — 需求看板";
}

function closeMenus() {
  document.querySelectorAll(".fmenu.open").forEach(m => m.classList.remove("open"));
  document.querySelectorAll('.fbtn[aria-expanded="true"]')
    .forEach(b => b.setAttribute("aria-expanded", "false"));
}

fRepo.addEventListener("change", () => { rebuildFilters(); render(); });

// 菜单内的勾选、搜索、开合全部走事件委托，重建选项后无需重新绑定
filtersEl.addEventListener("change", e => {
  const cb = e.target;
  if (!cb.matches("input[type=checkbox]")) return;

  const key = cb.dataset.filter;
  if (cb.classList.contains("fall-cb")) {
    optsEl(key).querySelectorAll("input").forEach(x => { x.checked = cb.checked; });
    syncAll(key);
  } else {
    syncAll(cb.closest(".fopts").dataset.filter);
  }
  render();
});

filtersEl.addEventListener("input", e => {
  if (!e.target.matches(".fsearch-input")) return;
  const q = e.target.value.trim().toLowerCase();
  e.target.closest(".fmenu").querySelectorAll(".opt").forEach(o => {
    o.hidden = !!q && !o.textContent.toLowerCase().includes(q);
  });
});

filtersEl.addEventListener("click", e => {
  const btn = e.target.closest(".fbtn");
  if (!btn) return;

  const menu = menuEl(btn.dataset.filter);
  const open = menu.classList.contains("open");
  closeMenus();

  if (!open) {
    menu.classList.add("open");
    btn.setAttribute("aria-expanded", "true");
    const s = menu.querySelector(".fsearch-input");
    if (s) { s.value = ""; menu.querySelectorAll(".opt").forEach(o => o.hidden = false); s.focus(); }
  }
});

clearBtn.addEventListener("click", () => {
  FILTERS.forEach(f => {
    optsEl(f.key).querySelectorAll("input").forEach(cb => { cb.checked = true; });
    syncAll(f.key);
  });
  render();
});

document.addEventListener("click", e => {
  if (!e.target.closest(".ctrl")) closeMenus();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeMenus();
});

document.querySelectorAll(".seg button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".seg button").forEach(b =>
      b.setAttribute("aria-pressed", String(b === btn))
    );
    document.body.dataset.density = btn.dataset.d;
  });
});

rebuildFilters();
render();
</script>
</body>
</html>

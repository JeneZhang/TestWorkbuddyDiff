<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>需求看板</title>
<style>
  :root {
    color-scheme: light;
    --ink: #17202a;
    --ink-2: #55616f;
    --ink-3: #6f7b87;
    --paper: #eceff3;
    --card: #ffffff;
    --line: #dde3e9;
    --line-hard: #c2cad3;
    --warn: #c2392f;
    --link: #1f5c99;
    --focus: #17202a;
    --shadow: 0 1px 2px rgba(23, 32, 42, .07), 0 2px 6px rgba(23, 32, 42, .05);
    --shadow-up: 0 2px 4px rgba(23, 32, 42, .09), 0 6px 14px rgba(23, 32, 42, .07);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  /* 顶栏定高、看板占满剩余高度并自己滚动，
     这样列头的 sticky 相对看板生效，不依赖手填的顶栏高度 */
  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    /* 中文字形较满，行高放宽、字距归零 */
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 "Source Han Sans SC", "Noto Sans CJK SC", -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.7;
    letter-spacing: 0;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 顶栏：标题行 + 筛选行 ---------- */

  .bar {
    flex: none;
    background: var(--card);
    border-bottom: 1px solid var(--line-hard);
    box-shadow: 0 1px 3px rgba(23, 32, 42, .04);
    z-index: 20;
  }

  .bar-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 14px;
    padding: 12px 22px;
  }

  .bar-row + .bar-row { border-top: 1px solid var(--line); padding: 9px 22px 10px; }

  .bar-spacer { flex: 1 1 auto; }

  /* 仓库名由数据驱动，不写死 */
  .brand { display: flex; align-items: baseline; gap: 5px; margin: 0; font-size: 18px; font-weight: 600; }
  .brand .org { color: var(--ink-3); font-weight: 500; font-size: 16px; }
  .brand .slash { color: var(--line-hard); font-weight: 400; }

  .repo-wrap { position: relative; display: inline-flex; align-items: baseline; }

  .repo {
    font: inherit;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 1px 21px 1px 5px;
    margin-left: -5px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
  }

  .repo:hover { background: var(--paper); border-color: var(--line); }

  .repo-wrap .caret {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    color: var(--ink-3);
    pointer-events: none;
  }

  .ctrl { display: inline-flex; align-items: center; gap: 7px; position: relative; }
  .ctrl > label { font-size: 12px; color: var(--ink-3); white-space: nowrap; }

  .filter-btn {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line-hard);
    border-radius: 5px;
    padding: 6px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
    min-width: 120px;
  }

  .filter-btn:hover { border-color: var(--ink-3); background: var(--paper); }

  .filter-btn.active {
    border-color: var(--ink);
    background: var(--paper);
  }

  .filter-btn::after {
    content: "▾";
    font-size: 10px;
    color: var(--ink-3);
    margin-left: auto;
    transition: transform .2s;
  }

  .filter-btn.active::after {
    transform: rotate(180deg);
  }

  .filter-menu {
    position: absolute;
    top: 100%;
    left: 0;
    background: var(--card);
    border: 1px solid var(--line-hard);
    border-radius: 5px;
    box-shadow: var(--shadow-up);
    z-index: 100;
    margin-top: 4px;
    min-width: 250px;
    display: none;
    flex-direction: column;
    max-height: 400px;
  }

  .filter-menu.open { display: flex; }

  .filter-search {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .filter-search input {
    width: 100%;
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--line-hard);
    border-radius: 4px;
    padding: 6px 8px;
  }

  .filter-search input::placeholder {
    color: var(--ink-3);
  }

  .filter-options {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 0;
  }

  .filter-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink);
  }

  .filter-option:hover {
    background: var(--paper);
  }

  .filter-option input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--ink);
    flex-shrink: 0;
  }

  .filter-option label {
    flex: 1;
    cursor: pointer;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .filter-all {
    padding: 8px 12px;
    border-top: 1px solid var(--line);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }

  .filter-all:hover {
    background: var(--paper);
  }

  .filter-all input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--ink);
  }

  .filter-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    flex: 1;
    min-width: 0;
  }

  .filter-tag {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 2px 6px;
    font-size: 12px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .count { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .count b { color: var(--ink); font-weight: 600; }

  .clear {
    font: inherit;
    font-size: 12px;
    color: var(--ink-2);
    background: var(--paper);
    border: 1px solid var(--line-hard);
    border-radius: 5px;
    padding: 3px 9px;
    cursor: pointer;
  }

  .clear:hover { color: var(--ink); border-color: var(--ink-3); }
  .clear[hidden] { display: none; }

  .tabs { display: inline-flex; border: 1px solid var(--line-hard); border-radius: 5px; overflow: hidden; }

  .tabs button {
    font: inherit;
    font-size: 13px;
    padding: 4px 12px;
    background: var(--card);
    color: var(--ink-2);
    border: 0;
    border-right: 1px solid var(--line);
    cursor: pointer;
  }

  .tabs button:last-child { border-right: 0; }
  .tabs button:hover { background: var(--paper); }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- 看板 ---------- */

  /* 六列放不下一屏，横向滚动；列宽固定以免被压扁 */
  /* 看板是唯一的滚动容器，列头相对它吸顶 */
  .board {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(228px, 1fr);
    gap: 1px;
    background: var(--line-hard);
    align-items: stretch;
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
  }

  .col { background: var(--paper); padding: 0 12px 28px; min-width: 0; }

  .col-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    /* 负外边距让吸顶条盖住列的左右内边距，滚动时卡片不会从缝隙里透出来 */
    margin: 0 -12px;
    padding: 11px 14px 9px;
    position: sticky;
    top: 0;
    background: var(--paper);
    border-top: 3px solid var(--line-hard);
    border-bottom: 1px solid var(--line);
    z-index: 10;
  }

  /* 单色深浅梯度提示流程方向，末列最深 —— 不需要图例 */
  .col:nth-child(1) .col-head { border-top-color: #ccd3da; }
  .col:nth-child(2) .col-head { border-top-color: #b4bec8; }
  .col:nth-child(3) .col-head { border-top-color: #9aa5b1; }
  .col:nth-child(4) .col-head { border-top-color: #7d8a97; }
  .col:nth-child(5) .col-head { border-top-color: #55616f; }
  .col:nth-child(6) .col-head { border-top-color: #17202a; }

  .col-head h2 { margin: 0; font-size: 14px; font-weight: 600; }

  .col-head .n {
    font-size: 12px;
    color: var(--ink-2);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 0 7px;
  }

  /* ---------- 卡片 ---------- */
  /* 卡片是 article 而不是 button：按钮里不能嵌链接，
     而编号与 PR 都要能单独点。整卡可点由标题链接的 ::after 铺满实现。 */

  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 7px;
    margin-bottom: 9px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: box-shadow .12s ease, transform .12s ease, border-color .12s ease;
  }

  .card:hover {
    border-color: var(--line-hard);
    box-shadow: var(--shadow-up);
    transform: translateY(-1px);
  }

  /* 卡片内获得焦点时整卡描边，键盘操作能看清位置 */
  .card:focus-within { border-color: var(--ink-3); }

  .card-body { padding: 11px 12px 10px; }

  .card-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }

  /* 编号是独立链接，层级高于标题的铺满层 */
  .id {
    font-size: 12px;
    color: var(--ink-3);
    flex: none;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    position: relative;
    z-index: 2;
  }

  .id:hover { color: var(--link); border-bottom-color: currentColor; }

  .ver {
    margin-left: auto;
    font-size: 11px;
    color: var(--ink-2);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0 6px;
    flex: none;
  }

  .title { margin: 0 0 9px; font-size: 14px; font-weight: 600; line-height: 1.55; }

  /* 标题链接铺满整张卡：点卡片任意空白处即进详情 */
  .title a {
    color: inherit;
    text-decoration: none;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .title a::after { content: ""; position: absolute; inset: 0; z-index: 1; }
  .card:hover .title a { color: var(--link); }

  /* ---------- 人：创建人 → 处理人（可多人） ---------- */
  /* 颜色用于身份识别，不用于状态；名字紧随头像，无需图例 */

  .meta { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); min-width: 0; }

  .ppl { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .ppl .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .meta .to { color: var(--line-hard); flex: none; font-size: 11px; }

  /* 多人时头像轻微叠放，省宽度又能看出人数 */
  .faces { display: inline-flex; flex: none; }
  .faces .who + .who { margin-left: -5px; }

  .who {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--ink-2);
    color: #fff;
    font-size: 11px;
    font-weight: 500;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    box-shadow: 0 0 0 1.5px var(--card);
  }

  .who[data-c="1"] { background: #2a5f91; }
  .who[data-c="2"] { background: #1c6657; }
  .who[data-c="3"] { background: #6f4a91; }
  .who[data-c="4"] { background: #94551f; }
  .who[data-c="5"] { background: #4d5a68; }
  .who[data-c="6"] { background: #8c3559; }

  .who.na {
    background: transparent;
    border: 1px dashed var(--line-hard);
    color: var(--ink-3);
    font-size: 10px;
    box-shadow: none;
  }

  .ppl.na .nm { color: var(--ink-3); }

  /* ---------- 状态区：关键词，不用色块 ---------- */
  /* PR 与流水线各占一行，互不混用 */

  .state { border-top: 1px solid var(--line); background: #fbfcfd; }

  .row {
    padding: 6px 12px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
  }

  .row + .row { border-top: 1px dashed var(--line); }

  /* 关键词靠字重与字色分级，不靠颜色块 */
  /* 不设标签列：关键词自身已说明维度（「PR 开启中」「流水线失败」） */
  .row .kw { font-size: 13px; font-weight: 600; flex: none; }

  .row[data-pr="none"]   .kw { color: var(--ink-3); font-weight: 400; }
  .row[data-pr="open"]   .kw { color: var(--ink); }
  .row[data-pr="merged"] .kw { color: var(--ink-2); font-weight: 400; }

  .row[data-ci="pass"]    .kw { color: var(--ink-2); font-weight: 400; }
  .row[data-ci="running"] .kw { color: var(--ink); }
  .row[data-ci="fail"]    .kw { color: var(--warn); }
  .row[data-ci="na"]      .kw { color: var(--ink-3); font-weight: 400; }

  /* PR 引用是独立链接，层级高于标题的铺满层 */
  .row .ref {
    font-size: 12px;
    color: var(--ink-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    position: relative;
    z-index: 2;
  }

  .row a.ref:hover { color: var(--link); border-bottom-color: currentColor; }

  .row .more { margin-left: auto; flex: none; font-size: 12px; color: var(--ink-3); }

  /* ---------- 紧凑模式 ---------- */
  /* 保留头像（站会要知道谁在做），隐去名字与引用 */

  body[data-density="compact"] .meta .nm { display: none; }
  body[data-density="compact"] .row .ref { display: none; }
  body[data-density="compact"] .title a { -webkit-line-clamp: 1; }
  body[data-density="compact"] .title { margin-bottom: 7px; }

  .empty {
    border: 1px dashed var(--line-hard);
    border-radius: 7px;
    padding: 14px 12px;
    font-size: 13px;
    color: var(--ink-3);
    text-align: center;
  }

  @media (max-width: 900px) {
    /* 窄屏纵向排列，交回页面滚动。顶栏吸顶；列头改为静态——
       顶栏在窄屏会折行、高度不定，两个 sticky 叠在 top:0 只会互相遮挡 */
    body { height: auto; display: block; }
    .bar { position: sticky; top: 0; }
    .board { grid-auto-flow: row; grid-auto-columns: auto; min-height: 0; overflow: visible; }
    .col-head { position: static; }
    .col { padding-bottom: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body data-density="full">

<div class="bar">
  <div class="bar-row">
    <h1 class="brand">
      <span class="org">workbuddy</span><span class="slash">/</span>
      <span class="repo-wrap">
        <select id="f-repo" class="repo" aria-label="仓库"></select>
        <span class="caret">▾</span>
      </span>
    </h1>

    <span class="count" id="count"></span>

    <span class="bar-spacer"></span>

    <div class="tabs" role="group" aria-label="卡片密度">
      <button type="button" data-d="full" aria-pressed="true">完整</button>
      <button type="button" data-d="compact" aria-pressed="false">紧凑</button>
    </div>
  </div>

  <div class="bar-row">
    <div class="ctrl">
      <label>版本</label>
      <button type="button" class="filter-btn" data-filter="ver" aria-expanded="false">
        <span class="filter-tags" id="f-ver-tags"></span>
      </button>
      <div class="filter-menu" id="f-ver-menu">
        <div class="filter-search">
          <input type="text" placeholder="搜索" class="filter-search-input">
        </div>
        <div class="filter-options" id="f-ver-options"></div>
        <label class="filter-all">
          <input type="checkbox" data-filter="ver" class="filter-all-checkbox" checked>
          <span>全部</span>
        </label>
      </div>
    </div>

    <div class="ctrl">
      <label>创建人</label>
      <button type="button" class="filter-btn" data-filter="who" aria-expanded="false">
        <span class="filter-tags" id="f-who-tags"></span>
      </button>
      <div class="filter-menu" id="f-who-menu">
        <div class="filter-search">
          <input type="text" placeholder="搜索" class="filter-search-input">
        </div>
        <div class="filter-options" id="f-who-options"></div>
        <label class="filter-all">
          <input type="checkbox" data-filter="who" class="filter-all-checkbox" checked>
          <span>全部</span>
        </label>
      </div>
    </div>

    <div class="ctrl">
      <label>处理人</label>
      <button type="button" class="filter-btn" data-filter="as" aria-expanded="false">
        <span class="filter-tags" id="f-as-tags"></span>
      </button>
      <div class="filter-menu" id="f-as-menu">
        <div class="filter-search">
          <input type="text" placeholder="搜索" class="filter-search-input">
        </div>
        <div class="filter-options" id="f-as-options"></div>
        <label class="filter-all">
          <input type="checkbox" data-filter="as" class="filter-all-checkbox" checked>
          <span>全部</span>
        </label>
      </div>
    </div>

    <div class="ctrl">
      <label>PR 状态</label>
      <button type="button" class="filter-btn" data-filter="pr" aria-expanded="false">
        <span class="filter-tags" id="f-pr-tags"></span>
      </button>
      <div class="filter-menu" id="f-pr-menu">
        <div class="filter-options" id="f-pr-options"></div>
        <label class="filter-all">
          <input type="checkbox" data-filter="pr" class="filter-all-checkbox" checked>
          <span>全部</span>
        </label>
      </div>
    </div>

    <div class="ctrl">
      <label>流水线</label>
      <button type="button" class="filter-btn" data-filter="ci" aria-expanded="false">
        <span class="filter-tags" id="f-ci-tags"></span>
      </button>
      <div class="filter-menu" id="f-ci-menu">
        <div class="filter-options" id="f-ci-options"></div>
        <label class="filter-all">
          <input type="checkbox" data-filter="ci" class="filter-all-checkbox" checked>
          <span>全部</span>
        </label>
      </div>
    </div>

    <button type="button" class="clear" id="clear" hidden>清空筛选</button>
  </div>
</div>

<div class="board" id="board"></div>

<script>
const COLS = [
  { key: "to-review",  name: "待评审" },
  { key: "reviewed",   name: "已评审" },
  { key: "trial",      name: "产品体验中" },
  { key: "to-accept",  name: "待验收" },
  { key: "accepted",   name: "验收通过" },
  { key: "done",       name: "已完成" }
];

// 仓库名来自数据，不写死在标题里
const REPOS = [
  { key: "api",   name: "workbuddy-api" },
  { key: "web",   name: "workbuddy-web" },
  { key: "agent", name: "workbuddy-agent" }
];

// 链接地址集中在这里，换代码托管平台只改这两个函数
const HOST = "https://git.workbuddy.internal/workbuddy";
function issueURL(repo, id) { return HOST + "/" + repo + "/issues/" + id; }
function prURL(repo, num)   { return HOST + "/" + repo + "/pulls/" + num; }

// 人：c 是头像配色编号。颜色只用于身份识别，不承载状态含义。
const PEOPLE = {
  alice:  { nick: "林安", c: 1 },
  bob:    { nick: "陈博", c: 2 },
  chen:   { nick: "程晨", c: 3 },
  priya:  { nick: "普里", c: 4 },
  dmitri: { nick: "周德", c: 5 },
  fang:   { nick: "方琳", c: 6 }
};

// who = 创建人（单人）；as = 处理人数组，可多人，空数组表示未分配
// PR 三态：pr 为 null 表示未关联；merged 决定「已合并」或「PR 开启中」
// ci 独立于 PR 状态：'pass' | 'running' | 'fail' | null(未触发)
// 卡片只展示标题，不展示描述正文
const ISSUES = [

// PR 三态判定：无 PR / PR 开启中 / 已合并。刻意不读取 ci 字段。
function prOf(pr) {
  if (!pr) return { key: "none", kw: "无 PR", ref: "", more: "" };
  if (pr.merged) return {
    key: "merged", kw: "已合并",
    ref: "#" + pr.num + " → " + (pr.into || "未知分支"),
    more: pr.extra ? "另 " + pr.extra + " 个" : ""
  };
  return {
    key: "open", kw: "PR 开启中",
    ref: "#" + pr.num + " · " + pr.author,
    more: pr.extra ? "另 " + pr.extra + " 个" : ""
  };
}

// 流水线状态判定：与 PR 状态完全独立，互不覆盖
// 关键词自带「流水线」前缀，因此卡片上不再需要单独的标签列
const CI_TEXT = { pass: "流水线通过", running: "流水线运行中", fail: "流水线失败" };

function ciOf(pr) {
  if (!pr || !pr.ci) return { key: "na", kw: "流水线未触发", show: !!pr };
  return { key: pr.ci, kw: CI_TEXT[pr.ci], show: true };
}

const board = document.getElementById("board");
const fRepo = document.getElementById("f-repo");
const countEl = document.getElementById("count");
const clearBtn = document.getElementById("clear");

const filterConfigs = {
  ver: { menuId: "f-ver-menu", optionsId: "f-ver-options", tagsId: "f-ver-tags", searchable: true },
  who: { menuId: "f-who-menu", optionsId: "f-who-options", tagsId: "f-who-tags", searchable: true },
  as: { menuId: "f-as-menu", optionsId: "f-as-options", tagsId: "f-as-tags", searchable: true },
  pr: { menuId: "f-pr-menu", optionsId: "f-pr-options", tagsId: "f-pr-tags", searchable: false },
  ci: { menuId: "f-ci-menu", optionsId: "f-ci-options", tagsId: "f-ci-tags", searchable: false }
};

const NO_ASSIGNEE = "__none";
const MAX_FACES = 3;

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}

// 语义化版本按段比较：字典序会把 5.10.0 排到 5.9.0 前面
function cmpVer(a, b) {
  const x = a.split(".").map(Number), y = b.split(".").map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    const d = (y[i] || 0) - (x[i] || 0);   // 新版本在前
    if (d) return d;
  }
  return 0;
}

function byNick(a, b) {
  return PEOPLE[a].nick.localeCompare(PEOPLE[b].nick, "zh-CN");
}

REPOS.forEach(r => {
  fRepo.insertAdjacentHTML("beforeend", '<option value="' + r.key + '">' + esc(r.name) + '</option>');
});

// 选项只列当前仓库里实际存在的值，避免选出必然为空的组合。
// 切仓库后若原选项仍存在则保留，否则回到「全部」。
function fillOptions(filterKey, pairs) {
  const config = filterConfigs[filterKey];
  const optionsEl = document.getElementById(config.optionsId);
  const menu = document.getElementById(config.menuId);
  const allCheckbox = menu.querySelector(".filter-all-checkbox");
  const prev = Array.from(optionsEl.querySelectorAll("input:checked"), e => e.value);

  optionsEl.innerHTML = pairs.map(([v, l]) =>
    `<label class="filter-option">
      <input type="checkbox" value="${esc(v)}" checked>
      <span>${esc(l)}</span>
    </label>`
  ).join("");

  optionsEl.querySelectorAll("input").forEach(cb => {
    cb.addEventListener("change", () => {
      updateAllCheckboxState(filterKey);
      updateTags(filterKey);
      render();
    });
  });

  allCheckbox.addEventListener("change", () => {
    const checked = allCheckbox.checked;
    optionsEl.querySelectorAll("input").forEach(cb => cb.checked = checked);
    updateTags(filterKey);
    render();
  });

  allCheckbox.checked = true;
  updateTags(filterKey);
}

function updateAllCheckboxState(filterKey) {
  const config = filterConfigs[filterKey];
  const optionsEl = document.getElementById(config.optionsId);
  const menu = document.getElementById(config.menuId);
  const allCheckbox = menu.querySelector(".filter-all-checkbox");

  const checkboxes = Array.from(optionsEl.querySelectorAll("input"));
  const allChecked = checkboxes.length > 0 && checkboxes.every(cb => cb.checked);
  allCheckbox.checked = allChecked;
}

function updateTags(filterKey) {
  const config = filterConfigs[filterKey];
  const optionsEl = document.getElementById(config.optionsId);
  const selectedValues = Array.from(optionsEl.querySelectorAll("input:checked"), e => e.value);
  const tagsEl = document.getElementById(config.tagsId);

  const allCount = optionsEl.querySelectorAll("input").length;

  if (selectedValues.length === 0) {
    tagsEl.innerHTML = `<span class="filter-tag">无选择</span>`;
    document.querySelector(`[data-filter="${filterKey}"]`).classList.add("active");
  } else if (selectedValues.length === allCount) {
    tagsEl.innerHTML = `<span class="filter-tag">全部</span>`;
    document.querySelector(`[data-filter="${filterKey}"]`).classList.remove("active");
  } else {
    const labels = Array.from(optionsEl.querySelectorAll("input:checked")).map(cb => {
      return cb.nextElementSibling.textContent.trim();
    });
    tagsEl.innerHTML = labels.map(l => `<span class="filter-tag">${esc(l)}</span>`).join("");
    document.querySelector(`[data-filter="${filterKey}"]`).classList.add("active");
  }
}

function getSelectedValues(filterKey) {
  const config = filterConfigs[filterKey];
  const optionsEl = document.getElementById(config.optionsId);
  return Array.from(optionsEl.querySelectorAll("input:checked"), e => e.value);
}

function rebuildFilters() {
  const inRepo = ISSUES.filter(i => i.repo === fRepo.value);

  fillOptions("ver", [...new Set(inRepo.map(i => i.ver))].sort(cmpVer).map(v => [v, "v" + v]));
  fillOptions("who", [...new Set(inRepo.map(i => i.who))].sort(byNick).map(k => [k, PEOPLE[k].nick]));

  const assignees = [...new Set(inRepo.flatMap(i => i.as))].sort(byNick)
    .map(k => [k, PEOPLE[k].nick]);
  if (inRepo.some(i => i.as.length === 0)) assignees.push([NO_ASSIGNEE, "未分配"]);
  fillOptions("as", assignees);

  fillOptions("pr", [["none", "无 PR"], ["open", "PR 开启中"], ["merged", "已合并"]]);
  fillOptions("ci", [["fail", "流水线失败"], ["running", "流水线运行中"], ["pass", "流水线通过"], ["na", "流水线未触发"]]);
}

function repoName() {
  const r = REPOS.find(r => r.key === fRepo.value);
  return r ? r.name : "";
}

// 单人：头像 + 名字。多人：叠放头像 + 首位名字 + 「+N」
function peopleHTML(keys, role) {
  if (!keys.length) {
    return '<span class="ppl na" title="' + role + '：未分配">' +
             '<span class="who na">—</span><span class="nm">未分配</span></span>';
  }

  const all = keys.map(k => PEOPLE[k].nick).join("、");
  const faces = keys.slice(0, MAX_FACES).map(k => {
    const p = PEOPLE[k];
    return '<span class="who" data-c="' + p.c + '">' + esc(p.nick.slice(0, 1)) + '</span>';
  }).join("");

  const label = keys.length === 1
    ? esc(PEOPLE[keys[0]].nick)
    : esc(PEOPLE[keys[0]].nick) + " +" + (keys.length - 1);

  return '<span class="ppl" title="' + role + '：' + esc(all) + '">' +
           '<span class="faces">' + faces + '</span>' +
           '<span class="nm">' + label + '</span>' +
         '</span>';
}

function cardHTML(it) {
  const p = prOf(it.pr);
  const c = ciOf(it.pr);

  // PR 引用做成链接；无 PR 时没有可指向的地址，保持纯文本
  const refHTML = p.ref
    ? (it.pr
        ? '<a class="ref mono" href="' + prURL(it.repo, it.pr.num) + '" target="_blank" rel="noopener">' +
            esc(p.ref) + '</a>'
        : '<span class="ref mono">' + esc(p.ref) + '</span>')
    : '';

  // PR 与流水线各自一行，独立渲染，互不影响
  // 关键词自身已说明维度，不再加标签列
  const prRow = '<div class="row" data-pr="' + p.key + '">' +
      '<span class="kw">' + esc(p.kw) + '</span>' +
      refHTML +
      (p.more ? '<span class="more">' + esc(p.more) + '</span>' : '') +
    '</div>';

  const ciRow = c.show
    ? '<div class="row" data-ci="' + c.key + '">' +
        '<span class="kw">' + esc(c.kw) + '</span>' +
      '</div>'
    : '';

  return '<article class="card">' +
    '<div class="card-body">' +
      '<div class="card-top">' +
        '<a class="id mono" href="' + issueURL(it.repo, it.id) + '" target="_blank" rel="noopener">#' +
          it.id + '</a>' +
        '<span class="ver mono">v' + esc(it.ver) + '</span>' +
      '</div>' +
      '<h3 class="title"><a href="' + issueURL(it.repo, it.id) + '" target="_blank" rel="noopener">' +
        esc(it.title) + '</a></h3>' +
      '<div class="meta">' +
        peopleHTML([it.who], "创建人") +
        '<span class="to">→</span>' +
        peopleHTML(it.as, "处理人") +
      '</div>' +
    '</div>' +
    '<div class="state">' + prRow + ciRow + '</div>' +
  '</article>';
}

function render() {
  let v = getSelectedValues("ver");
  let w = getSelectedValues("who");
  let a = getSelectedValues("as");
  let p = getSelectedValues("pr");
  let ci = getSelectedValues("ci");

  // 当全选时，视为不筛选
  const verAll = document.getElementById("f-ver-options").querySelectorAll("input").length;
  const whoAll = document.getElementById("f-who-options").querySelectorAll("input").length;
  const asAll = document.getElementById("f-as-options").querySelectorAll("input").length;
  const prAll = document.getElementById("f-pr-options").querySelectorAll("input").length;
  const ciAll = document.getElementById("f-ci-options").querySelectorAll("input").length;

  if (v.length === verAll) v = [];
  if (w.length === whoAll) w = [];
  if (a.length === asAll) a = [];
  if (p.length === prAll) p = [];
  if (ci.length === ciAll) ci = [];

  const filtering = !!(v.length || w.length || a.length || p.length || ci.length);

  const inRepo = ISSUES.filter(it => it.repo === fRepo.value);

  const shown = inRepo.filter(it =>
    (!v.length || v.includes(it.ver)) &&
    (!w.length || w.includes(it.who)) &&
    (!a.length || (a.includes(NO_ASSIGNEE) ? it.as.length === 0 : it.as.some(x => a.includes(x)))) &&
    (!p.length || p.includes(prOf(it.pr).key)) &&
    (!ci.length || ci.includes(ciOf(it.pr).key))
  );

  board.innerHTML = COLS.map(c => {
    const items = shown.filter(i => i.col === c.key);

    return '<section class="col">' +
      '<div class="col-head">' +
        '<h2>' + c.name + '</h2>' +
        '<span class="n mono">' + items.length + '</span>' +
      '</div>' +
      (items.length
        ? items.map(cardHTML).join("")
        : '<div class="empty">' + (filtering ? "当前筛选下没有需求" : "暂无需求") + '</div>') +
    '</section>';
  }).join("");

  countEl.innerHTML = filtering
    ? '筛选出 <b>' + shown.length + '</b> 条 / 共 ' + inRepo.length + ' 条'
    : '共 <b>' + inRepo.length + '</b> 条需求';

  clearBtn.hidden = !filtering;
  document.title = repoName() + " — 需求看板";
}

fRepo.addEventListener("change", () => { rebuildFilters(); render(); });

clearBtn.addEventListener("click", () => {
  ["ver", "who", "as", "pr", "ci"].forEach(filterKey => {
    const config = filterConfigs[filterKey];
    const optionsEl = document.getElementById(config.optionsId);
    const menu = document.getElementById(config.menuId);
    const allCheckbox = menu.querySelector(".filter-all-checkbox");
    optionsEl.querySelectorAll("input").forEach(cb => cb.checked = true);
    allCheckbox.checked = true;
    updateTags(filterKey);
  });
  render();
});

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const filterKey = btn.dataset.filter;
    const config = filterConfigs[filterKey];
    const menu = document.getElementById(config.menuId);
    const isOpen = menu.classList.contains("open");

    document.querySelectorAll(".filter-menu.open").forEach(m => m.classList.remove("open"));
    document.querySelectorAll(".filter-btn.active-menu").forEach(b => b.classList.remove("active-menu"));

    if (!isOpen) {
      menu.classList.add("open");
      btn.classList.add("active-menu");
      if (config.searchable) {
        menu.querySelector(".filter-search-input").focus();
      }
    }
  });
});

document.querySelectorAll(".filter-search-input").forEach(input => {
  input.addEventListener("input", (e) => {
    const menu = e.target.closest(".filter-menu");
    const query = e.target.value.toLowerCase();
    const options = menu.querySelectorAll(".filter-option");

    options.forEach(opt => {
      const text = opt.textContent.toLowerCase();
      opt.style.display = text.includes(query) ? "" : "none";
    });
  });
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".ctrl")) {
    document.querySelectorAll(".filter-menu.open").forEach(m => m.classList.remove("open"));
    document.querySelectorAll(".filter-btn.active-menu").forEach(b => b.classList.remove("active-menu"));
  }
});

document.querySelectorAll(".tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach(b =>
      b.setAttribute("aria-pressed", String(b === btn))
    );
    document.body.dataset.density = btn.dataset.d;
  });
});

rebuildFilters();
render();
</script>
